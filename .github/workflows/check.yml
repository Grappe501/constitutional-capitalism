name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# H:-only protocol applies to the local machine, not GitHub-hosted runners.
# CI may use GitHub's managed paths and dependency caches.

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate content
        run: pnpm content:validate

      - name: Validate project data
        run: pnpm project:validate

      - name: Generate progress snapshot
        run: pnpm progress:generate

      - name: Validate progress snapshot
        run: pnpm progress:validate

      - name: Check book-site
        run: pnpm book:check

      - name: Check build-board
        run: pnpm board:check

      - name: Build book-site
        run: pnpm book:build

      - name: Build build-board
        run: pnpm board:build

      - name: Generate report and handoff
        run: |
          pnpm report:generate
          pnpm handoff:generate
