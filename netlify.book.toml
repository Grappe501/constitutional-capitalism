# Netlify configuration for the public book website.
# Create a Netlify site connected to Grappe501/constitutional-capitalism.
#
# Recommended UI settings if not using this file directly:
#   Base directory: apps/book-site
#   Build command: cd ../.. && corepack enable && pnpm install --frozen-lockfile && pnpm --filter book-site build
#   Publish directory: dist
#
# When [build].base is set, publish is relative to that base directory.

[build]
  base = "apps/book-site"
  command = "cd ../.. && corepack enable && pnpm install --frozen-lockfile && pnpm --filter book-site build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  ASTRO_TELEMETRY_DISABLED = "1"

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
